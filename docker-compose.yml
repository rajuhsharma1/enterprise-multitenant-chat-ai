name: enterprise-multitenant-chat-ai
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__init_multitenant_rls_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres-init:
    image: postgres:16.4
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: local-postgres-password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h postgres -U postgres -d chat -v ON_ERROR_STOP=1 <<'SQL'
        DO $$$$ BEGIN IF NOT EXISTS(SELECT FROM pg_roles WHERE rolname='chat_app') THEN
          CREATE ROLE chat_app LOGIN PASSWORD 'local-chat-password' NOSUPERUSER NOBYPASSRLS;
        END IF; END $$$$;
        GRANT CONNECT ON DATABASE chat TO chat_app;
        GRANT USAGE ON SCHEMA public TO chat_app;
        GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO chat_app;
        SQL
  scylla:
    image: scylladb/scylla:5.4.9
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1"]
    ports: ["127.0.0.1:9042:9042"]
    volumes: ["scylla-data:/var/lib/scylla"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 40
  scylla-init:
    image: scylladb/scylla:5.4.9
    depends_on:
      scylla: {condition: service_healthy}
    volumes: ["./src/main/resources/cassandra/init_keyspace.cql:/init.cql:ro"]
    entrypoint: ["/bin/sh", "-ec", "cqlsh scylla -f /init.cql"]
  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3,kms
      AWS_DEFAULT_REGION: eu-central-1
    ports: ["127.0.0.1:4566:4566"]
    volumes: ["localstack-data:/var/lib/localstack"]
volumes:
  postgres-data:
  scylla-data:
  redis-data:
  kafka-data:
  qdrant-data:
  localstack-data:
