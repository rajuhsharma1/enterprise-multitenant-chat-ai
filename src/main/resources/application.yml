spring:
  application:
    name: enterprise-multitenant-chat-ai
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${POSTGRES_USER:chat_app}
    password: ${POSTGRES_PASSWORD:local-chat-password}
    hikari:
      maximum-pool-size: 32
      auto-commit: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/chat}
    user: ${FLYWAY_USER:postgres}
    password: ${FLYWAY_PASSWORD:local-postgres-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}:9042
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    keyspace-name: enterprise_chat
    schema-action: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 900000
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONCURRENCY:4}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
  tomcat:
    max-connections: 10000
app:
  region: ${APP_REGION:eu-central-1}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8180/realms/chat}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/chat/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:enterprise-chat}
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000}
  kafka:
    partitions: ${KAFKA_PARTITIONS:48}
    replicas: ${KAFKA_REPLICAS:1}
  backbone:
    regions: ${BACKBONE_REGIONS:eu-central-1=http://localhost:8080}
    token: ${BACKBONE_TOKEN:}
  aws:
    endpoint: ${AWS_ENDPOINT_URL:}
  s3:
    documents: ${S3_DOCUMENT_BUCKET:enterprise-chat-documents}
    archive: ${S3_ARCHIVE_BUCKET:enterprise-chat-archive}
  qdrant:
    host: ${QDRANT_HOST:localhost}
    grpc-port: ${QDRANT_GRPC_PORT:6334}
    tls: ${QDRANT_TLS:false}
    api-key: ${QDRANT_API_KEY:}
    collection: policies
  ai:
    base-url: ${AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${AI_API_KEY:}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    dimensions: ${AI_DIMENSIONS:1536}
logging:
  level:
    com.enterprise.chat: INFO
