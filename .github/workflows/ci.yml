name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test tenant isolation against PostgreSQL 16
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Validate local infrastructure
        run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/enterprise-multitenant-chat-ai-1.0.0.jar
